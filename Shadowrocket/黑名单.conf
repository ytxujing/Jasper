# ======= 综合被墙域名代理集 ======= #
# 放在本地直连/拦截规则之后；同为 PROXY 的常见流量命中后，可跳过后续手工例外及专属集检查。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/proxy.txt,PROXY

# ======= AI 服务走代理 ======= #
# OpenAI/Claude/Gemini/Copilot/Perplexity 等常见域名已由前面的 proxy.txt 覆盖。
# 保留综合集当前未覆盖的 AI 例外：
DOMAIN-SUFFIX,ai.com,PROXY
DOMAIN-KEYWORD,openai,PROXY

# ======= 群晖 Synology ======= #
# synology.com、synology.me、myds.me、quickconnect.to 当前由 proxy.txt 覆盖。
# synology.cn 与 quickconnect.cn 的 REJECT 例外已放在 proxy.txt 之前。

# ======= 网站走代理（黑名单） ======= #
# github.com 当前由 proxy.txt 覆盖；保留综合集未覆盖的 speedtest.net。
