# ======= 兜底直连（黑名单模式核心） ======= #
FINAL,DIRECT

[Host]
localhost = 127.0.0.1
# *.ytxujing.cn = server:119.29.29.29

[URL Rewrite]
# ======= Google 域名重定向（保留路径和查询参数） ======= #
^https?://(www\.)?g\.cn([/?].*)?$ https://www.google.com$2 302
^https?://(www\.)?google\.cn([/?].*)?$ https://www.google.com$2 302
# ======= 微信明确的广告接口 ======= #
^https?://mp\.weixin\.qq\.com/mp/getappmsgad - reject
^https?://mp\.weixin\.qq\.com/mp/ad_biz_info - reject
^https?://mp\.weixin\.qq\.com/mp/ad_video - reject

# ======= 有道词典路径级广告过滤（补充域名规则未覆盖的接口） ======= #
^https?://dict\.youdao\.com/.*?adv - reject
^https?://dict\.youdao\.com/.*?ad_ - reject
^https?://api\.youdao\.com/.*?ad - reject
^https?://.*\.youdao\.com/.*?splash - reject
^https?://.*\.youdao\.com/.*?banner - reject
