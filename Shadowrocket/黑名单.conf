[General]
bypass-system = true
# 增加国内常用内网网段
skip-proxy = localhost, *.local, captive.apple.com
tun-excluded-routes = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 224.0.0.0/4, 255.255.255.255/32
# 主 DNS 使用 AliDNS 与腾讯 DoH；备用 DNS 保留原有设置。
dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query
fallback-dns-server = https://adh.ytxujing.cn:8443/dns-query/dns
ipv6 = true
prefer-ipv6 = true
icmp-auto-reply = true
# 开启这个可以自动处理那些不支持UDP的节点
udp-policy-not-supported-behaviour = DIRECT

[Rule]
# ======= 回家 ======= #
IP-CIDR,192.168.123.0/24,CN-SS(24H),no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
DOMAIN-SUFFIX,ytxujing.cn,DIRECT

# ======= 去广告 ======= #
# RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/reject.txt,REJECT
# 微信广告
DOMAIN-SUFFIX,wxs.qq.com,REJECT
DOMAIN-SUFFIX,adservice.sigmob.cn,REJECT
DOMAIN-SUFFIX,szextshort.weixin.qq.com,REJECT
DOMAIN-KEYWORD,weixinadinfo,REJECT
DOMAIN-KEYWORD,wxadservice,REJECT
DOMAIN-KEYWORD,wxsnsad,REJECT
# 有道词典广告
