# ======= 兜底直连（黑名单模式核心） ======= #
FINAL,DIRECT

[Host]
localhost = 127.0.0.1

[URL Rewrite]
# ======= Google 域名重定向 ======= #
^https?://(www\.)?g\.cn([/?].*)?$ https://www.google.com$2 302
^https?://(www\.)?google\.cn([/?].*)?$ https://www.google.com$2 302
# ======= 微信明确的广告接口 ======= #
^https?://mp\.weixin\.qq\.com/mp/getappmsgad - reject
^https?://mp\.weixin\.qq\.com/mp/ad_biz_info - reject
^https?://mp\.weixin\.qq\.com/mp/ad_video - reject

